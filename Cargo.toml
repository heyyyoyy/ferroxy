[package]
name = "ferroxy"
version = "0.1.0"
edition = "2024"

[dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
